name: Hybrid Articulated WebGL Rig QA

on:
  push:
    branches:
      - feature/webgl-mesh-rig
      - release/v0.4.0-alpha.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: npm run check
      - name: Regression tests
        run: npm test
