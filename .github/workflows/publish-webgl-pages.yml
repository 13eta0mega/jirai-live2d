name: Publish WebGL Mesh Rig Demo

on:
  push:
    branches:
      - feature/webgl-mesh-rig
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webgl-mesh-rig-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebGL mesh rig
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mirror current commit to gh-pages
        run: git push origin HEAD:refs/heads/gh-pages
